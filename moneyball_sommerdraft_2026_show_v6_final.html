<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moneyball Sommerdraft 2026</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #050505;
      --panel: rgba(17,17,17,.94);
      --panel2: #151515;
      --line: #303030;
      --muted: #a6a6a6;
      --gold: #ffd76a;
      --silver: #d8d8d8;
      --bronze: #d2925b;
      --red: #ff4d4d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.16), transparent 28%),
        radial-gradient(circle at 20% 80%, rgba(255,215,106,.08), transparent 28%),
        linear-gradient(180deg, #191919, #050505 62%);
      color: white;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    body:before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black, transparent 80%);
      pointer-events: none;
    }
    #app { width: 100vw; height: 100vh; }
    .screen {
      display: none;
      width: 100%; height: 100%;
      align-items: center; justify-content: center; flex-direction: column;
      text-align: center;
      padding: 22px;
    }
    .screen.active { display: flex; }
    .badge {
      display: inline-flex; align-items: center; gap: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.04);
      border-radius: 999px;
      padding: 8px 16px;
      color: #cfcfcf;
      margin-bottom: 22px;
      letter-spacing: 2.6px;
      font-size: 13px;
      text-transform: uppercase;
    }
    .badge:before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 18px var(--gold); }
    h1 {
      font-size: clamp(44px, 8vw, 94px);
      margin: 0;
      letter-spacing: -3px;
      line-height: .9;
      text-transform: uppercase;
    }
    h2 { font-size: clamp(34px, 6vw, 68px); margin: 0 0 28px; letter-spacing: -2px; text-transform: uppercase; }
    p { color: var(--muted); font-size: clamp(18px, 3vw, 24px); line-height: 1.55; }
    button {
      margin-top: 28px;
      background: #fff;
      color: #080808;
      border: 0;
      padding: 15px 26px;
      border-radius: 16px;
      font-weight: 900;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 14px 45px rgba(255,255,255,.16);
    }
    button.secondary { background: rgba(255,255,255,.08); color: white; border: 1px solid rgba(255,255,255,.16); box-shadow: none; }
    .button-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .stage {
      position: relative;
      width: min(980px, 96vw);
      min-height: min(74vh, 760px);
      background: linear-gradient(180deg, rgba(25,25,25,.96), rgba(8,8,8,.96));
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 34px;
      padding: clamp(22px, 5vw, 50px);
      box-shadow: 0 0 120px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.08);
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      overflow: hidden;
    }
    .stage:after {
      content: ""; position: absolute; inset: -35%;
      background: conic-gradient(from 180deg, transparent, rgba(255,255,255,.06), transparent, rgba(255,215,106,.06), transparent);
      animation: slowSpin 16s linear infinite;
      pointer-events: none;
    }
    .stage > * { position: relative; z-index: 2; }
    .big-text {
      font-size: clamp(38px, 8vw, 86px);
      font-weight: 950;
      letter-spacing: -2.5px;
      line-height: .95;
      text-transform: uppercase;
      animation: cinematicIn 1.1s cubic-bezier(.19,1,.22,1) both;
      max-width: 100%;
    }
    .sub-text {
      margin-top: 18px;
      color: #bababa;
      font-size: clamp(19px, 3.2vw, 32px);
      line-height: 1.35;
      animation: fadeUp 1.2s .18s ease both;
      max-width: 790px;
    }
    .micro { margin-top: 12px; color: #777; font-size: 13px; letter-spacing: 1.7px; text-transform: uppercase; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; width: 100%; }
    .manager-card {
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      padding: 20px 16px;
      min-height: 148px;
      display: flex; flex-direction: column; justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.35);
      animation: cardEnter .72s cubic-bezier(.19,1,.22,1) both;
      min-width: 0;
      overflow: hidden;
    }
    .manager-card h3 {
      font-size: clamp(17px, 2.25vw, 28px);
      margin: 10px 0 0;
      letter-spacing: -.8px;
      line-height: 1.05;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
      hyphens: auto;
    }
    .manager-card span { margin-top: 9px; color: #a9a9a9; font-size: 14px; line-height: 1.25; }
    .manager-card .rank { align-self: center; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.08); color: #ddd; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .gold { border-color: rgba(255,215,106,.95); box-shadow: 0 0 48px rgba(255,215,106,.25), inset 0 1px 0 rgba(255,255,255,.12); }
    .silver { border-color: rgba(216,216,216,.85); box-shadow: 0 0 42px rgba(216,216,216,.16), inset 0 1px 0 rgba(255,255,255,.12); }
    .bronze { border-color: rgba(210,146,91,.9); box-shadow: 0 0 42px rgba(210,146,91,.17), inset 0 1px 0 rgba(255,255,255,.12); }
    .pick-number { font-size: clamp(48px, 10vw, 108px); font-weight: 950; color: rgba(255,255,255,.72); letter-spacing: -4px; line-height: .95; }
    .reveal-name { font-size: clamp(40px, 8vw, 94px); font-weight: 950; margin-top: 14px; letter-spacing: -3px; line-height: .95; animation: flipIn .9s cubic-bezier(.19,1,.22,1) both; overflow-wrap: anywhere; }
    .lottery-winner { color: var(--gold); text-shadow: 0 0 38px rgba(255,215,106,.55); }
    .pulse-name { animation: pulseBeat 1s ease-in-out infinite; }
    .tension-panel {
      width: min(760px, 94vw); padding: 30px; border-radius: 26px;
      border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.045);
    }
    .remaining { margin-top: 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 850px; }
    .chip { padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.08); color: #d3d3d3; border: 1px solid rgba(255,255,255,.11); font-size: 13px; max-width: 180px; overflow-wrap: anywhere; }
    .lottery-symbol {
      width: 130px; height: 130px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.18);
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.32), rgba(255,215,106,.2) 36%, rgba(255,255,255,.04) 70%);
      box-shadow: 0 0 58px rgba(255,215,106,.18), inset 0 1px 0 rgba(255,255,255,.15);
      margin-bottom: 24px;
      animation: orbBreath 2.2s ease-in-out infinite;
    }
    .duel-board { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 22px; width: min(780px, 94vw); margin-top: 26px; }
    .duel-card {
      min-height: 245px;
      border-radius: 26px;
      border: 1px solid rgba(255,255,255,.16);
      background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 48px rgba(0,0,0,.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transform-style: preserve-3d;
      animation: cardEnter .8s cubic-bezier(.19,1,.22,1) both;
    }
    .duel-card.winner { border-color: rgba(255,215,106,.95); box-shadow: 0 0 56px rgba(255,215,106,.2), inset 0 1px 0 rgba(255,255,255,.1); }
    .duel-card .duel-pick { color: rgba(255,255,255,.58); font-size: clamp(34px, 6vw, 58px); font-weight: 950; letter-spacing: -2px; }
    .duel-card .duel-name { margin-top: 18px; font-size: clamp(28px, 5vw, 56px); font-weight: 950; letter-spacing: -2px; line-height: 1; overflow-wrap: anywhere; max-width: 100%; }
    .duel-card .duel-tag { margin-top: 14px; color: #bfbfbf; font-size: clamp(16px, 2.2vw, 23px); line-height: 1.25; max-width: 100%; }
    .duel-hidden .duel-name, .duel-hidden .duel-tag { opacity: 0; transform: rotateX(90deg); }
    .duel-revealed .duel-name { animation: flipIn .85s cubic-bezier(.19,1,.22,1) both; }
    #finalBoard { width: min(760px, 94vw); max-height: 70vh; overflow: auto; padding-right: 2px; }
    .board-row {
      display: grid; grid-template-columns: 100px 1fr 130px; gap: 14px; align-items: center;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 16px;
      padding: 15px 18px;
      margin: 10px 0;
      font-size: 19px;
      text-align: left;
      animation: fadeUp .6s ease both;
    }
    .board-row strong { color: #fff; }
    .board-row small { color: #aaa; text-align: right; }
    .board-row.highlight { border-color: rgba(255,215,106,.95); background: rgba(255,215,106,.11); box-shadow: 0 0 34px rgba(255,215,106,.14); }
    .confetti { position: fixed; width: 10px; height: 14px; top: -25px; animation: fall 3.8s linear forwards; z-index: 999; border-radius: 2px; }
    .winner-crown { font-size: clamp(54px, 10vw, 120px); filter: drop-shadow(0 0 22px rgba(255,215,106,.45)); animation: crownDrop 1s cubic-bezier(.19,1,.22,1) both; }
    @keyframes cinematicIn { from { opacity: 0; transform: scale(.84) translateY(24px); filter: blur(10px); } to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cardEnter { from { opacity: 0; transform: translateY(28px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes flipIn { from { opacity: 0; transform: rotateX(90deg) scale(.92); } to { opacity: 1; transform: rotateX(0) scale(1); } }
    @keyframes pulseBeat { 0%,100% { transform: scale(1); text-shadow: 0 0 0 rgba(255,255,255,0); } 50% { transform: scale(1.045); text-shadow: 0 0 30px rgba(255,255,255,.28); } }
    @keyframes fall { to { transform: translateY(112vh) rotate(880deg); opacity: 0; } }
    @keyframes slowSpin { to { transform: rotate(360deg); } }
    @keyframes crownDrop { from { opacity: 0; transform: translateY(-40px) scale(.5) rotate(-10deg); } to { opacity: 1; transform: translateY(0) scale(1) rotate(0); } }
    @keyframes orbBreath { 0%,100% { transform: scale(1); opacity: .72; } 50% { transform: scale(1.06); opacity: 1; } }
    @media (max-width: 620px) {
      .stage { min-height: 78vh; border-radius: 26px; }
      .card-grid { grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 12px; }
      .duel-board { grid-template-columns: 1fr; }
      .board-row { grid-template-columns: 82px 1fr; }
      .board-row small { grid-column: 2; text-align: left; }
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="start-screen" class="screen active">
      <div class="badge">Moneyball</div>
      <h1>Sommerdraft 2026</h1>
      <p>10 Manager<br>3 gesicherte Picks<br>7 Lose<br>1 Champion</p>
      <div class="button-row">
        <button id="startBtn">Sommerdraft starten</button>
        <button id="fullscreenBtn" class="secondary">Vollbild</button>
      </div>
    </section>
    <section id="show-screen" class="screen"><div id="stage" class="stage"></div></section>
    <section id="final-screen" class="screen">
      <h2>Moneyball Sommerdraft 2026</h2>
      <div id="finalBoard"></div>
      <div class="button-row">
        <button id="restartBtn">Nochmal starten</button>
        <button id="fullscreenBtn2" class="secondary">Vollbild</button>
      </div>
    </section>
  </div>

  <script>
    const fixedPicks = [
      { pick: 1, name: "Fabs", reason: "Platz 2 der Vorsaison. Der Premium-Pick wandert direkt in die Vitrine.", className: "gold", label: "Der erste Zugriff" },
      { pick: 2, name: "Denny Crane", reason: "Platz 3 der Vorsaison. Konstanz zahlt sich aus, heute sogar mit Pick #2.", className: "silver", label: "Podium zahlt Dividende" },
      { pick: 3, name: "Mathmos", reason: "Platz 4 der Vorsaison. Der letzte garantierte Sitz im Oberhaus.", className: "bronze", label: "Das letzte sichere Ticket" }
    ];

    const lotteryManagers = [
      { name: "Gio", rank: 1 },
      { name: "Kaud", rank: 5 },
      { name: "Der Panther", rank: 6 },
      { name: "Crouch Potato", rank: 7 },
      { name: "Jay_Goppingen", rank: 8 },
      { name: "Schlacke04", rank: 9 },
      { name: "Thias", rank: 10 }
    ];

    const revealTexts = {
      10: "Die erste Ausrede der Saison ist bereits geboren.",
      9: "Nicht letzter. Kleine Siege zählen auch.",
      8: "Niemand redet drüber. Noch nicht.",
      7: "Hier entscheidet sich Genie oder Wahnsinn.",
      6: "Hier beginnt das Taktieren.",
      5: "So gut und doch nur fast.",
      4: "Jackpot? Vielleicht."
    };

    const pulseDurations = {
      10: 7,
      9: 8,
      8: 10,
      7: 10,
      6: 15
    };

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const fullscreenBtn2 = document.getElementById("fullscreenBtn2");
    const stage = document.getElementById("stage");
    const finalBoard = document.getElementById("finalBoard");

    startBtn.addEventListener("click", startSommerdraft);
    restartBtn.addEventListener("click", () => location.reload());
    fullscreenBtn.addEventListener("click", toggleFullscreen);
    fullscreenBtn2.addEventListener("click", toggleFullscreen);



    function silentMoment(seconds) {
      return wait(seconds * 1000);
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(screen => screen.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    function sample(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    async function startSommerdraft() {
      showScreen("show-screen");
      await introSequence();
      await fixedPickCeremony();
      await championStory();
      await participantIntro();
      const lotteryResult = runLottery();
      await lotteryMachine();
      await revealPicks(lotteryResult);
      await winnerEncore(lotteryResult.find(x => x.pick === 4));
      showFinalBoard(lotteryResult);
    }

    async function introSequence() {
      const lines = [
        ["MONEYBALL", "Sommerdraft 2026"],
        ["10 Manager", "1 Champion"],
        ["3 gesicherte Picks", "7 Lose"],
        ["Manche Picks werden verdient", "Andere müssen gewonnen werden"],
        ["Heute entscheidet kein Bauchgefühl", "Heute entscheidet die Kugel."],
        ["Die Bühne ist bereit", "Der Sommerdraft beginnt"]
      ];
      for (const [main, sub] of lines) {
        stage.innerHTML = `<div class="big-text">${main}</div><div class="sub-text">${sub}</div>`;
        await wait(3800);
      }
    }

    async function fixedPickCeremony() {
      stage.innerHTML = `<div class="big-text">Die verdienten Picks</div><div class="sub-text">Drei Manager müssen heute nicht zittern. Unangenehm souverän.</div>`;
      await wait(3600);
      for (const manager of fixedPicks) {
        stage.innerHTML = `
          <div class="manager-card ${manager.className}" style="width:min(640px,92vw); min-height:270px;">
            <span class="rank">${manager.label}</span>
            <div class="pick-number">Pick #${manager.pick}</div>
            <h3>${manager.name}</h3>
            <span>${manager.reason}</span>
          </div>`;
        await wait(5600);
      }
    }

    async function championStory() {
      const lines = [
        ["GIO", "Platz 1. Meister. Champion."],
        ["Die Liga bezwungen", "Den Titel geholt. Die Tabelle regiert."],
        ["Doch heute beginnt alles bei Null", "Auch der Champion muss durch die Lotterie."],
        ["Kein Freilos", "Kein Samthandschuh. Kein VIP-Eingang."],
        ["Sein Schicksal", "ist noch nicht geschrieben."]
      ];
      for (const [main, sub] of lines) {
        stage.innerHTML = `<div class="big-text">${main}</div><div class="sub-text">${sub}</div>`;
        await wait(4200);
      }
    }

    async function participantIntro() {
      stage.innerHTML = `<div class="big-text">Die Lotterie</div><div class="sub-text">Sieben Manager. Sieben Schicksale. Ein Ziel.</div>`;
      await wait(3400);
      stage.innerHTML = `<div class="card-grid">${lotteryManagers.map((manager, index) => `
        <div class="manager-card" style="animation-delay:${index * 120}ms">
          <span class="rank">Platz ${manager.rank}</span>
          <h3>${manager.name}</h3>
          <span>Gleiche Chancen</span>
        </div>`).join("")}</div>`;
      await wait(7200);
    }

    function runLottery() {
      const shuffled = [...lotteryManagers];
      fisherYatesShuffle(shuffled);
      return shuffled.map((manager, index) => ({ pick: index + 4, name: manager.name, rank: manager.rank }));
    }

    function fisherYatesShuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [array[i], array[randomIndex]] = [array[randomIndex], array[i]];
      }
    }

    async function lotteryMachine() {
      stage.innerHTML = `<div class="big-text">LETZTE CHANCE</div><div class="sub-text">Möge der Fußballgott mit euch sein.</div>`;
      await wait(3600);

      stage.innerHTML = `
        <div class="lottery-symbol"></div>
        <div class="big-text">Der Topf ist geschlossen</div>
        <div class="sub-text">Sieben Namen sind drin. Ab jetzt gibt es keine Verhandlungen mehr.</div>`;
      await wait(4200);

      for (let i = 5; i >= 1; i--) {
        stage.innerHTML = `
          <div class="lottery-symbol"></div>
          <div class="big-text">${i}</div>
          <div class="sub-text">Der Sommerdraft startet...</div>`;
        await wait(1150);
      }

      stage.innerHTML = `<div class="big-text">Ziehung läuft</div><div class="sub-text">Das Schicksal entscheidet.</div>`;
      await wait(3600);
    }

    async function revealPicks(result) {
      const revealOrder = [...result].reverse();
      const regularReveals = revealOrder.filter(item => item.pick >= 6);
      const pick5 = result.find(item => item.pick === 5);
      const pick4 = result.find(item => item.pick === 4);
      const remaining = [...result].map(x => x.name);

      for (const item of regularReveals) {
        const text = revealTexts[item.pick];
        remaining.splice(remaining.indexOf(item.name), 1);

        stage.innerHTML = `
          <div class="pick-number">Pick #${item.pick}</div>
          <div class="reveal-name">${item.name}</div>
          <div class="sub-text">${text}</div>
          ${remaining.length ? `<div class="remaining">${remaining.map(name => `<span class="chip">${name}</span>`).join("")}</div>` : ""}
        `;
        await wait(3900);
        await pulsePause(item, remaining, pulseDurations[item.pick]);
      }

      await finalDuelReveal(pick5, pick4);
    }

    async function pulsePause(lastPick, remaining, seconds) {
      stage.innerHTML = `
        <div class="tension-panel">
          <div class="pick-number">Pick #${lastPick.pick}</div>
          <div class="reveal-name pulse-name">${lastPick.name}</div>
        </div>
      `;
      await silentMoment(seconds);
    }

    async function finalDuelReveal(pick5, pick4) {
      stage.innerHTML = `
        <div class="big-text">Nur noch zwei</div>
        <div class="sub-text">Einer bekommt Pick #5. Einer bekommt Pick #4. Der Rest ist Schweigen und Puls.</div>
        <div class="remaining"><span class="chip">${pick5.name}</span><span class="chip">${pick4.name}</span></div>
      `;
      await wait(5200);

      stage.innerHTML = `
        <div class="big-text lottery-winner">And the winner is...</div>
        <div class="sub-text">Das letzte Los entscheidet den Abend.</div>
      `;
      await wait(4200);

      stage.innerHTML = `
        <div class="duel-board">
          <div class="duel-card duel-hidden">
            <div class="duel-pick">Pick #5</div>
            <div class="duel-name">?</div>
          </div>
          <div class="duel-card winner duel-hidden">
            <div class="duel-pick lottery-winner">Pick #4</div>
            <div class="duel-name">?</div>
          </div>
        </div>
        <div class="sub-text">Zwei Karten. Ein Gewinner.</div>`;
      await silentMoment(4);

      stage.innerHTML = `
        <div class="duel-board">
          <div class="duel-card duel-revealed">
            <div class="duel-pick">Pick #5</div>
            <div class="duel-name">${pick5.name}</div>
            <div class="duel-tag">${revealTexts[5]}</div>
          </div>
          <div class="duel-card winner duel-revealed">
            <div class="duel-pick lottery-winner">Pick #4</div>
            <div class="duel-name lottery-winner">${pick4.name}</div>
            <div class="duel-tag">${revealTexts[4]}</div>
          </div>
        </div>
        <div class="sub-text">Pick #4 ist vergeben. Die Lotterie hat gesprochen.</div>`;
      createConfetti(220);
      await wait(7600);
    }

    async function winnerEncore(winner) {
      stage.innerHTML = `
        <div class="winner-crown">🏆</div>
        <div class="big-text lottery-winner">${winner.name}</div>
        <div class="sub-text">Gewinner der Lotterie. Pick #4. Der Sommerdraft hat seinen ersten Hauptdarsteller.</div>
      `;
      createConfetti(240);
      await wait(8200);
    }

    function showFinalBoard(lotteryResult) {
      showScreen("final-screen");
      const fullDraft = [
        ...fixedPicks.map(item => ({ pick: item.pick, name: item.name, type: "Gesichert" })),
        ...lotteryResult.map(item => ({ pick: item.pick, name: item.name, type: item.pick === 4 ? "Lottery Winner" : "Lottery" }))
      ];
      finalBoard.innerHTML = fullDraft.map((item, idx) => `
        <div class="board-row ${item.pick === 4 ? "highlight" : ""}" style="animation-delay:${idx * 80}ms">
          <strong>Pick #${item.pick}</strong>
          <span>${item.name}</span>
          <small>${item.type}</small>
        </div>`).join("");
    }

    function createConfetti(amount = 100) {
      for (let i = 0; i < amount; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.background = randomConfettiColor();
        piece.style.animationDelay = `${Math.random() * 1.1}s`;
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 5200);
      }
    }

    function randomConfettiColor() {
      const colors = ["#ffd76a", "#ffffff", "#ff4d4d", "#4dff9a", "#5f8cff", "#b56cff"];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  </script>
</body>
</html>
